.logo{font:800 20px system-ui;padding:6px 10px 14px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:14px}

.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}

.hc .hi{width:52px;height:52px;border-radius:14px;background:var(--k);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px}.hc h2{color:var(--k)}
</style>
