<html lang="en" data-theme="light">
<head>

<title>PendulumLab – Integrated STEM Mini-Research</title>

#nav button{width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:10px 12px;border-radius:10px;font:600 15px system-ui;cursor:pointer;border-left:4px solid transparent}

#nav button.on{background:var(--c2);border-left-color:var(--k)}
#th,.btn{border:1px solid var(--bd);background:var(--c2);color:var(--tx);padding:9px 14px;border-radius:10px;font:600 14px system-ui;cursor:pointer}
#th{margin-top:auto}.btn:hover,#th:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{margin-left:236px;flex:1;padding:22px 28px;max-width:1200px;min-width:0}
#menu{display:none;position:fixed;top:10px;right:10px;z-index:30}
h1{margin:0 0 4px;font-size:28px}h2{margin:0 0 8px;font-size:19px}

#tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font:600 14px system-ui}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.s3d{height:460px;border-radius:14px;background:radial-gradient(circle at 50% 30%,var(--c2),var(--card));border:1px solid var(--bd);cursor:grab;position:relative;overflow:hidden}
canvas.c{width:100%;display:block;border-radius:12px;background:var(--c2);border:1px solid var(--bd);touch-action:none}
.hud{position:absolute;left:10px;top:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font:600 13px system-ui;pointer-events:none}
.ro{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.ro div{background:var(--c2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mut)}.ro b{display:block;font-size:18px;color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px}
input[type=range]{width:100%;accent-color:var(--ac)}
table{border-collapse:collapse;width:100%;font-size:13px;display:block;overflow-x:auto}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}th{background:var(--c2)}
td input{width:80px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.fc{perspective:900px;height:210px;max-width:520px;margin:10px auto;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font:700 20px system-ui;border:2px solid var(--k);background:var(--card)}
.fs.b{transform:rotateY(180deg);background:var(--k);color:#fff;font-size:17px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.o{transform:none}main{margin-left:0;padding:56px 14px 20px}#menu{display:block}.s3d{height:380px}}
</style>
</head>
